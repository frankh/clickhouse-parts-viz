# Local demo: ClickHouse with a table that gets small inserts all the time,
# so you can watch parts appear and merge.
#   docker compose -f deploy/docker-compose.yml up --build
#   open http://localhost:8080
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./config.d/part_log.xml:/etc/clickhouse-server/config.d/part_log.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "demo", "-q", "SELECT count() FROM demo.events"]
      interval: 2s
      retries: 30

  seeder:
    image: clickhouse/clickhouse-server:25.8
    entrypoint: ["bash", "/seed.sh"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: demo
    volumes:
      - ./seed.sh:/seed.sh:ro
    depends_on:
      clickhouse: { condition: service_healthy }

  partsviz:
    build: ..
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: demo
      CLICKHOUSE_MAX_EXECUTION_TIME: "30"
    ports:
      - "${PARTSVIZ_PORT:-8080}:8080"
    depends_on:
      clickhouse: { condition: service_healthy }
